<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ADIN — Аналитика НИ × Демография</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  body { font-family: -apple-system, Arial, sans-serif; background: #f8f6f0; margin: 0; padding: 40px 20px; color: #1a1a2e; }
  .container { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 24px; margin-bottom: 4px; }
  h2 { font-size: 15px; margin: 0 0 16px; color: #1e3a5f; }
  .sub { color: #8888a8; font-size: 13px; margin-bottom: 24px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,.06); margin-bottom: 20px; }
  label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #4a4a6a; display: block; margin-bottom: 6px; }
  select { width: 100%; padding: 10px 12px; border: 1.5px solid #e8e4dc; border-radius: 8px; font-size: 14px; box-sizing: border-box; font-family: inherit; }
  .n-badge { font-size: 12px; color: #8888a8; margin-top: 4px; }
  canvas { max-height: 320px; }
  #screen-login { max-width: 380px; margin: 80px auto; text-align: center; }
  input[type=password] { width: 100%; padding: 10px 12px; border: 1.5px solid #e8e4dc; border-radius: 8px; font-size: 14px; box-sizing: border-box; margin-bottom: 10px; }
  button { background: #c8432a; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .error { color: #c0392b; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>

<div id="screen-login" style="display:none">
  <h1>Аналитика НИ × Демография</h1>
  <div class="sub">Введите ключ доступа</div>
  <input id="key-input" type="password" placeholder="Ключ доступа" onkeydown="if(event.key==='Enter')doLogin()">
  <button onclick="doLogin()">Войти</button>
  <div class="error" id="login-error" style="display:none">Неверный ключ.</div>
</div>

<div id="screen-main" class="container" style="display:none">
  <h1>Аналитика НИ × Демография</h1>
  <div class="sub">Связь анкетных данных с показателями Нарративного интеллекта</div>

  <div class="card">
    <label>Демографический признак</label>
    <select id="dimension-select" onchange="loadAll()">
      <option value="country">Страна</option>
      <option value="education">Образование</option>
      <option value="education_field">Направление образования</option>
      <option value="gender">Пол</option>
      <option value="age_range">Возраст</option>
      <option value="marital_status">Семейное положение</option>
      <option value="lang_native">Родной язык</option>
      <option value="industry">Сфера деятельности</option>
    </select>
  </div>

  <div class="card">
    <h2>Доминирующий архетип</h2>
    <canvas id="chart-archetype"></canvas>
  </div>

  <div class="card">
    <h2>Временная ориентация</h2>
    <canvas id="chart-temporal"></canvas>
  </div>

  <div class="card">
    <h2>Уровень зрелости (осознанности)</h2>
    <canvas id="chart-maturity"></canvas>
  </div>

  <div class="card">
    <h2>Средние баллы компетенций</h2>
    <canvas id="chart-competency"></canvas>
  </div>
</div>

<script>
const API = 'https://adin-ni-backend-production.up.railway.app/api';
let dashboardKey = localStorage.getItem('adin_dashboard_key') || '';

const PALETTE = ['#c8432a', '#1e3a5f', '#2d6a4f', '#c9a84c', '#8888a8', '#2d5a8e', '#6a4a8e'];
let charts = {};

window.onload = () => {
  if (dashboardKey) { showScreen('main'); loadAll(); }
  else { showScreen('login'); }
};

function showScreen(name) {
  document.getElementById('screen-login').style.display = name === 'login' ? 'block' : 'none';
  document.getElementById('screen-main').style.display = name === 'main' ? 'block' : 'none';
}

async function doLogin() {
  const key = document.getElementById('key-input').value.trim();
  if (!key) return;
  dashboardKey = key;
  try {
    await fetchJSON('/v2/analytics/crosstab?dimension=country&metric=archetype');
    localStorage.setItem('adin_dashboard_key', key);
    showScreen('main');
    loadAll();
  } catch (e) {
    document.getElementById('login-error').style.display = 'block';
  }
}

async function fetchJSON(path) {
  const r = await fetch(API + path, { headers: { 'x-dashboard-key': dashboardKey } });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function pivotCrosstab(rows) {
  const categories = [...new Set(rows.map(r => r.category))].sort();
  const types = [...new Set(rows.map(r => r.archetype))].sort();
  const lookup = {};
  rows.forEach(r => { lookup[r.category + '|' + r.archetype] = r.count; });
  const datasets = types.map((t, i) => ({
    label: t,
    data: categories.map(c => lookup[c + '|' + t] || 0),
    backgroundColor: PALETTE[i % PALETTE.length],
  }));
  return { labels: categories, datasets };
}

function renderBarChart(canvasId, labels, datasets, stacked) {
  if (charts[canvasId]) charts[canvasId].destroy();
  const ctx = document.getElementById(canvasId).getContext('2d');
  charts[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true,
      plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } },
      scales: {
        x: { stacked: !!stacked },
        y: { stacked: !!stacked, beginAtZero: true },
      },
    },
  });
}

async function loadAll() {
  const dimension = document.getElementById('dimension-select').value;

  try {
    const archetypeRows = await fetchJSON('/v2/analytics/crosstab?dimension=' + dimension + '&metric=archetype');
    const p = pivotCrosstab(archetypeRows);
    renderBarChart('chart-archetype', p.labels, p.datasets, true);
  } catch (e) { console.error('archetype:', e); }

  try {
    const temporalRows = await fetchJSON('/v2/analytics/crosstab?dimension=' + dimension + '&metric=temporal');
    const p = pivotCrosstab(temporalRows);
    renderBarChart('chart-temporal', p.labels, p.datasets, true);
  } catch (e) { console.error('temporal:', e); }

  try {
    const maturityRows = await fetchJSON('/v2/analytics/crosstab?dimension=' + dimension + '&metric=maturity');
    const p = pivotCrosstab(maturityRows);
    renderBarChart('chart-maturity', p.labels, p.datasets, true);
  } catch (e) { console.error('maturity:', e); }

  try {
    const comp = await fetchJSON('/v2/analytics/competency-avg?dimension=' + dimension);
    const labels = comp.rows.map(r => r.category + ' (n=' + r.n + ')');
    const compCols = Object.keys(comp.labels);
    const datasets = compCols.map((col, i) => ({
      label: comp.labels[col],
      data: comp.rows.map(r => r[col]),
      backgroundColor: PALETTE[i % PALETTE.length],
    }));
    renderBarChart('chart-competency', labels, datasets, false);
  } catch (e) { console.error('competency:', e); }
}
</script>
</body>
</html>
